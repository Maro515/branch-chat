<meta charset="utf-8">
<title>BranCHAT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#040a17;--bg2:#071229;--panel:rgba(8,20,45,.78);--panel2:rgba(10,26,58,.92);
  --ink:#dbe9ff;--muted:#7f9cc9;--line:rgba(80,160,255,.28);--glow:#4cc9ff;--accent:#2f8fff;
  --user:rgba(28,66,140,.32);--asst:rgba(8,20,45,.72);--dim:.5;--yellow:#ffd93d;
  --c0:#8fb3ff;--c1:#38bdf8;--c2:#f472b6;--c3:#34d399;--c4:#fb923c;--c5:#a78bfa;--c6:#22d3ee;--c7:#e879f9;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:
  radial-gradient(1200px 600px at 75% -10%,rgba(56,189,248,.20),transparent 60%),
  radial-gradient(900px 500px at 5% 110%,rgba(47,143,255,.16),transparent 60%),var(--bg);
  color:var(--ink);font:15px/1.7 "Noto Sans JP","Hiragino Sans","Noto Sans CJK JP",sans-serif;display:flex;flex-direction:column;position:relative}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(rgba(76,201,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(76,201,255,.07) 1px,transparent 1px);
  background-size:42px 42px;mask-image:radial-gradient(ellipse at center,#000 30%,transparent 90%)}
body::after{content:"";position:fixed;left:0;right:0;height:120px;top:-120px;pointer-events:none;z-index:0;
  background:linear-gradient(180deg,transparent,rgba(76,201,255,.08),transparent);animation:scan 9s linear infinite}
@keyframes scan{to{transform:translateY(calc(100vh + 240px))}}
header,#branchBar,main,#toast{position:relative;z-index:1}
header{display:flex;align-items:center;gap:8px;padding:4px 14px;border-bottom:1px solid var(--line);background:var(--panel);backdrop-filter:blur(8px);flex-wrap:wrap;box-shadow:0 1px 20px rgba(76,201,255,.12)}
header h1{font-size:16px;margin:0 8px 0 0;white-space:nowrap;letter-spacing:.12em;font-weight:700;color:#fff;text-shadow:0 0 10px var(--glow),0 0 24px rgba(76,201,255,.5)}
header select{max-width:220px}
select{font:inherit;color:var(--ink);background:rgba(10,30,70,.6);border:1px solid var(--line);border-radius:8px;padding:4px 8px}
.spacer{flex:1}
button{font:inherit;color:var(--ink);background:rgba(20,50,110,.35);border:1px solid var(--line);border-radius:8px;padding:5px 12px;cursor:pointer;transition:.15s;letter-spacing:.04em}
button:hover{border-color:var(--glow);box-shadow:0 0 12px rgba(76,201,255,.45);color:#fff}
button.primary{background:linear-gradient(135deg,#2f8fff,#22d3ee);color:#03101f;border-color:transparent;font-weight:700;box-shadow:0 0 16px rgba(56,189,248,.45)}
button.small{padding:2px 9px;font-size:12px;border-radius:6px}
button.plan{border-color:rgba(255,217,61,.55);color:var(--yellow)}
button.plan:hover,button.plan.on{background:rgba(255,217,61,.18);box-shadow:0 0 12px rgba(255,217,61,.5)}
button:disabled{opacity:.5;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;background:transparent}
.seg button.on{background:linear-gradient(135deg,#2f8fff,#22d3ee);color:#03101f;font-weight:700}
#branchBar{display:flex;gap:6px;padding:3px 14px;border-bottom:1px solid var(--line);background:rgba(6,16,36,.7);overflow-x:auto;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--bc);color:var(--bc);border-radius:999px;padding:2px 10px;font-size:12px;white-space:nowrap;cursor:pointer;background:rgba(6,16,36,.7);box-shadow:0 0 8px -2px var(--bc)}
.chip.on{background:var(--bc);color:#03101f;font-weight:700;box-shadow:0 0 14px var(--bc)}
.chip.closed{opacity:.45;text-decoration:line-through}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--bc);box-shadow:0 0 6px var(--bc)}
.chip.on .dot{background:#03101f}
main{flex:1;min-height:0;display:flex}
#focus{flex:1;display:flex;flex-direction:column;min-width:0}
#crumb{padding:3px 14px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line);background:rgba(6,16,36,.5)}
#crumb b{text-shadow:0 0 8px currentColor}
#msgs{flex:1;overflow-y:auto;padding:6px 0 14px}
.msg{position:relative;max-width:860px;margin:0 auto 10px;padding:10px 14px 10px 18px;border:1px solid var(--line);border-left:3px solid var(--bc);border-radius:10px;background:var(--asst);backdrop-filter:blur(6px);box-shadow:0 0 22px -8px var(--bc),inset 0 0 40px rgba(76,201,255,.03)}
.msg.user{background:var(--user)}
.msg.planned{border-color:rgba(255,217,61,.6);box-shadow:0 0 22px -6px var(--yellow)}
.msg.outside{opacity:var(--dim)}
.msg.outside:hover{opacity:1}
.msg .meta{font-size:11px;color:var(--muted);display:flex;gap:8px;align-items:center;margin-bottom:2px;letter-spacing:.06em}
.msg .meta .tag{color:var(--bc);font-weight:700;text-shadow:0 0 8px var(--bc)}
.msg .meta .ptag{color:var(--yellow);text-shadow:0 0 8px var(--yellow)}
.msg .body{white-space:pre-wrap;word-break:break-word}
.msg .body code{background:rgba(76,201,255,.14);padding:0 4px;border-radius:4px;font-size:.92em}
.msg .body pre{background:rgba(3,10,26,.8);border:1px solid var(--line);padding:8px 10px;border-radius:8px;overflow-x:auto;white-space:pre}
.msg .tools{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:6px;margin-top:8px;padding-top:6px;border-top:1px dashed var(--line)}
.msg.user .tools{display:none}
.msg.user:hover .tools{display:flex}
.msg .tools:empty{display:none}
.badges{max-width:860px;margin:-4px auto 12px;padding-left:22px;font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.badges .chip{padding:1px 8px}
.divider{max-width:860px;margin:6px auto 12px;font-size:12px;color:var(--bc);border-top:1px dashed var(--bc);padding-top:4px;text-shadow:0 0 8px var(--bc)}
#composer{border-top:1px solid var(--line);background:var(--panel);backdrop-filter:blur(8px);padding:6px 14px;box-shadow:0 -1px 20px rgba(76,201,255,.1)}
#composer .row{display:flex;gap:8px;max-width:860px;margin:0 auto;align-items:flex-end}
textarea{flex:1;font:inherit;line-height:1.5;resize:none;min-height:44px;max-height:240px;border:1px solid var(--line);border-radius:10px;padding:10px 10px;background:rgba(3,10,26,.7);color:var(--ink)}
textarea:focus{outline:none;border-color:var(--glow);box-shadow:0 0 12px rgba(76,201,255,.4)}
#status{max-width:860px;margin:6px auto 0;font-size:11px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
#status a{color:var(--glow)}
#overview{flex:1;display:none;min-width:0}
#overview.on{display:flex}
#focus.off{display:none}
#graphWrap{flex:1;overflow:auto;position:relative;background:
  radial-gradient(2px 2px at 20% 30%,rgba(255,255,255,.35),transparent 60%),radial-gradient(2px 2px at 70% 60%,rgba(255,255,255,.3),transparent 60%),
  radial-gradient(1.5px 1.5px at 40% 80%,rgba(255,255,255,.3),transparent 60%),radial-gradient(1.5px 1.5px at 85% 20%,rgba(255,255,255,.25),transparent 60%),
  radial-gradient(900px 400px at 50% 0%,rgba(56,189,248,.14),transparent 70%),rgba(3,9,22,.85)}
#legend{position:sticky;top:0;left:0;font-size:11px;color:var(--muted);padding:6px 12px;background:rgba(3,9,22,.7);border-bottom:1px solid var(--line);display:flex;gap:14px;flex-wrap:wrap;z-index:2}
#legend i{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:middle;margin-right:4px}
#cards{width:340px;border-left:1px solid var(--line);overflow-y:auto;padding:10px;background:rgba(6,16,36,.6);backdrop-filter:blur(8px)}
.card{border:1px solid var(--line);border-left:3px solid var(--bc);border-radius:10px;padding:8px 10px;margin-bottom:10px;background:var(--panel);font-size:13px;box-shadow:0 0 18px -8px var(--bc)}
.card h3{margin:0 0 4px;font-size:14px;color:var(--bc);display:flex;align-items:center;gap:6px;text-shadow:0 0 8px var(--bc)}
.card .from{font-size:11px;color:var(--muted)}
.card .sum{margin:6px 0;white-space:pre-wrap}
.card .sum b{display:block;color:var(--muted);font-size:11px;font-weight:700;margin-top:4px;letter-spacing:.08em}
.card .act{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.card.pinned{box-shadow:0 0 0 1px var(--bc) inset,0 0 18px -4px var(--bc)}
.card.plans{--bc:var(--yellow)}
.card.plans .item{display:flex;gap:6px;align-items:center;justify-content:space-between;padding:4px 0;border-top:1px dashed rgba(255,217,61,.3);font-size:12px}
svg text{font-size:11px;fill:var(--ink);font-family:"Noto Sans JP",sans-serif}
.node{cursor:pointer}
.node:hover .core{stroke-width:3}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel2);color:var(--ink);padding:18px 20px;max-width:560px;width:92vw;box-shadow:0 0 40px rgba(76,201,255,.25);backdrop-filter:blur(10px)}
dialog::backdrop{background:rgba(2,6,16,.6)}
dialog h2{margin:0 0 10px;font-size:16px;letter-spacing:.1em;text-shadow:0 0 10px var(--glow)}
dialog label{display:block;margin:8px 0 2px;font-size:12px;color:var(--muted)}
dialog input[type=text],dialog input[type=password],dialog input[type=number],dialog select{width:100%;font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:rgba(3,10,26,.7);color:var(--ink)}
dialog .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.hint{font-size:11px;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(8,20,45,.95);border:1px solid var(--glow);color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;display:none;z-index:9;box-shadow:0 0 20px rgba(76,201,255,.5)}
@media (max-width:760px){#cards{width:100%;position:absolute;bottom:0;max-height:45%;border-left:0;border-top:1px solid var(--line)} #overview{position:relative}}

/* ===== 可読性モード: チャット・俯瞰図は白背景／藍色文字、線を太く ===== */
:root{--indigo:#1e3a6e;--indigo2:#4a5f8f;--yellow:#f5c400;--ystroke:#b45309;
  --c0:#3b5aa8;--c1:#0369a1;--c2:#be185d;--c3:#047857;--c4:#c2410c;--c5:#6d28d9;--c6:#0e7490;--c7:#a21caf;}
body{font-family:"Noto Sans JP","Hiragino Sans",sans-serif;font-size:14px}
/* 固定のUI文言（全員に共通して表示される部分）だけドットフォント */
.ui,button,.seg button,header h1,dialog h2,dialog label,dialog select,dialog option,#legend,.card .sum b,.card h3 .hint,#claudeHint,#ctxDlg .hint,textarea::placeholder,dialog input::placeholder{font-family:"DotGothic16","Noto Sans JP",sans-serif}
.var{font-family:"Noto Sans JP","Hiragino Sans",sans-serif}
.msg .body,textarea,input,#convSel,dialog input{font-family:"Noto Sans JP","Hiragino Sans",sans-serif}
#focus,#overview{--panel:#fff;--panel2:#fff;--ink:var(--indigo);--muted:var(--indigo2);--line:#b7c6e6;--user:#eef3fb;--asst:#fff;--glow:#3b5aa8;--dim:.6;
  background:#fff;color:var(--indigo)}
#crumb{background:#f5f8fe;border-bottom:1.5px solid var(--line);color:var(--indigo2)}
#crumb b{text-shadow:none}
#msgs{background:#fff}
.msg{background:#fff;border:1.5px solid var(--line);border-left:6px solid var(--bc);backdrop-filter:none;box-shadow:0 2px 10px rgba(30,58,110,.08);color:var(--indigo);line-height:1.7}
.msg.user{background:var(--user)}
.msg.planned{border-color:var(--ystroke);box-shadow:0 0 0 2px rgba(245,196,0,.45)}
.msg .meta{color:var(--indigo2)}
.msg .meta .tag{text-shadow:none}
.msg .meta .ptag{color:var(--ystroke);text-shadow:none}
.msg .body code{background:#eef3fb;color:var(--indigo)}
.msg .body pre{background:#f5f8fe;border:1.5px solid var(--line);color:var(--indigo)}
.divider{text-shadow:none;border-top:2px dashed var(--bc);font-weight:700}
.badges{color:var(--indigo2)}
#focus button,#overview button{background:#f5f8fe;color:var(--indigo);border:1.5px solid #9fb3d9}
#focus button:hover,#overview button:hover{border-color:var(--indigo);box-shadow:0 0 0 2px rgba(30,58,110,.15);color:var(--indigo)}
#focus button.primary{background:var(--indigo);color:#fff;border-color:var(--indigo);box-shadow:none}
#focus button.plan,#overview button.plan{border-color:var(--ystroke);color:var(--ystroke);background:#fff8dc}
#focus button.plan.on{background:#ffe680}
#focus .chip,#overview .chip{background:#fff;border-width:2px;box-shadow:none}
#focus .chip.on,#overview .chip.on{color:#fff}
#composer{background:#f5f8fe;border-top:2px solid var(--line);backdrop-filter:none;box-shadow:none}
textarea{background:#fff;color:var(--indigo);border:2px solid #9fb3d9}
textarea:focus{border-color:var(--indigo);box-shadow:0 0 0 3px rgba(30,58,110,.15)}
#status{color:var(--indigo2)}
#status a{color:var(--c1);font-weight:700}
#graphWrap{background:#fff;background-image:linear-gradient(rgba(30,58,110,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(30,58,110,.07) 1px,transparent 1px);background-size:42px 42px}
#legend{background:rgba(255,255,255,.92);border-bottom:1.5px solid var(--line);color:var(--indigo2)}
#cards{background:#f5f8fe;border-left:2px solid var(--line);backdrop-filter:none}
.card{background:#fff;border:1.5px solid var(--line);border-left:6px solid var(--bc);box-shadow:0 2px 10px rgba(30,58,110,.08);color:var(--indigo)}
.card h3{text-shadow:none}
.card .from,.card .sum b{color:var(--indigo2)}
.card.pinned{box-shadow:0 0 0 2px var(--bc) inset}
.card.plans{--bc:var(--ystroke)}
.card.plans h3{color:var(--ystroke)}
.card.plans .item{border-top:1.5px dashed #e6c76a}
svg text{fill:var(--indigo);font-family:"Noto Sans JP","Hiragino Sans",sans-serif;font-size:13px}
#toast{background:#fff;color:var(--indigo);border:2px solid var(--indigo);box-shadow:0 4px 20px rgba(30,58,110,.25)}

/* 選択テキストから質問するポップアップ */
#selPop{position:absolute;z-index:20;display:none;background:#fff;border:1.5px solid var(--indigo);border-radius:10px;box-shadow:0 6px 24px rgba(30,58,110,.25);padding:6px;gap:6px;align-items:center;max-width:calc(100vw - 32px)}
#selPop.on{display:flex;flex-wrap:wrap}
#selPop button{background:#f5f8fe;color:var(--indigo);border:1.5px solid #9fb3d9;font-family:"DotGothic16","Noto Sans JP",sans-serif;white-space:nowrap}
#selPop button:hover{border-color:var(--indigo);box-shadow:0 0 0 2px rgba(30,58,110,.15)}
#selPop button.fork{border-color:var(--c1);color:var(--c1)}
#selPop .q{font-size:11px;color:var(--indigo2);max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:"Noto Sans JP",sans-serif}
.msg .body::selection,.msg .body *::selection{background:#ffe680;color:var(--indigo)}

.editBox{width:100%;min-height:90px;font:inherit;font-family:"Noto Sans JP","Hiragino Sans",sans-serif;border:2px solid var(--indigo);border-radius:8px;padding:8px 10px;background:#fff;color:var(--indigo);resize:vertical}
.editBtns{display:flex;gap:6px;justify-content:flex-end;align-items:center;margin-top:6px;flex-wrap:wrap}
.editBtns .hint{margin-right:auto}
.msg.user .tools{display:flex}

header{z-index:5}
/* View メニュー（自前） */
.vmenu{position:relative}
#viewBtn{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;background:linear-gradient(135deg,rgba(47,143,255,.25),rgba(34,211,238,.18));border:1px solid var(--glow);color:#fff;letter-spacing:.08em;box-shadow:0 0 14px rgba(76,201,255,.35),inset 0 0 12px rgba(76,201,255,.12)}
#viewBtn .vk{color:var(--glow);font-weight:700}
#viewBtn .vsep{color:var(--muted)}
#viewBtn .vcaret{font-size:11px;color:var(--glow);transition:transform .2s}
.vmenu.open #viewBtn .vcaret{transform:rotate(180deg)}
.vpop{position:absolute;top:calc(100% + 8px);left:0;min-width:230px;background:rgba(6,16,36,.96);border:1px solid var(--glow);border-radius:12px;box-shadow:0 0 28px rgba(76,201,255,.4),0 12px 30px rgba(0,0,0,.5);padding:6px;display:none;z-index:40;backdrop-filter:blur(12px)}
.vpop::before{display:none;content:"";position:absolute;left:18px;top:-6px;width:10px;height:10px;background:rgba(6,16,36,.96);border-left:1px solid var(--glow);border-top:1px solid var(--glow);transform:rotate(45deg)}
.vmenu.open .vpop{display:grid;gap:4px;animation:vin .16s ease-out}
@keyframes vin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.vpop button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:1px solid transparent;padding:7px 10px;color:var(--ink);letter-spacing:.06em}
.vpop button:hover{border-color:var(--line);background:rgba(76,201,255,.1);box-shadow:none;color:#fff}
.vpop button.on{border-color:var(--glow);background:rgba(47,143,255,.22);color:#fff}
.vpop button i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--glow);flex:none}
.vpop button.on i{background:var(--glow);box-shadow:0 0 10px var(--glow)}
.vpop button small{margin-left:auto;color:var(--muted);font-size:11px;font-family:"Noto Sans JP",sans-serif;letter-spacing:0}
/* 分岐開始: 分岐元を画面上端へ寄せ、短く光らせる */
#msgs{position:relative}
#tailSpace{flex:none}
.msg.anchorFlash{animation:anchorFlash 1.4s ease-out}
@keyframes anchorFlash{0%{box-shadow:0 0 0 3px var(--bc),0 2px 10px rgba(30,58,110,.08)}100%{box-shadow:0 0 0 0 transparent,0 2px 10px rgba(30,58,110,.08)}}
@media (prefers-reduced-motion:reduce){.msg.anchorFlash{animation:none}}

/* ===== 通常のチャット配置: 自分=右 / AI=左 ===== */
#msgs{display:flex;flex-direction:column;--gut:max(16px,calc((100% - 860px)/2))}
.msg{width:fit-content;min-width:min(240px,80%);max-width:min(78%,680px);margin:0 auto 12px var(--gut)}
.msg.user{margin:0 var(--gut) 12px auto;border-left:1.5px solid var(--line);border-right:6px solid var(--bc);border-radius:14px 14px 4px 14px;background:var(--user)}
.msg:not(.user){border-radius:14px 14px 14px 4px}
.msg.user .meta{justify-content:flex-end}
.msg.editing{width:min(78%,680px)}
.badges,.divider{max-width:none;margin-left:var(--gut);margin-right:var(--gut)}
.badges{padding-left:6px}
#msgs>.msg:only-of-type{max-width:min(92%,680px)}
@media (max-width:600px){.msg{max-width:92%}.msg.editing{width:92%}}

/* ===== モデル変更ボタンとポップアップ ===== */
.sendCol{display:flex;flex-direction:row;gap:6px;align-items:stretch;position:relative}
.sendCol button{height:44px}
#modelBtn{font-size:12px;padding:4px 10px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;justify-content:center}
#modelBtn .ov{width:8px;height:8px;border-radius:50%;background:var(--bc,#9fb3d9);flex:none}
#modelPop{position:absolute;right:0;bottom:calc(100% + 8px);width:min(340px,calc(100vw - 32px));background:#fff;border:1.5px solid var(--indigo);border-radius:12px;box-shadow:0 8px 30px rgba(30,58,110,.28);padding:10px;z-index:30;display:none;color:var(--indigo);max-height:70vh;overflow:auto}
#modelPop.on{display:block}
#modelPop .mph{font-size:11px;color:var(--indigo2);letter-spacing:.08em;margin:8px 0 4px}
#modelPop .mph:first-child{margin-top:0}
#modelPop .row2{display:flex;flex-wrap:wrap;gap:6px}
#modelPop button{font-size:12px;padding:4px 9px}
#modelPop button.on{background:var(--indigo)!important;color:#fff!important;border-color:var(--indigo)!important}
#modelPop .res{margin-top:10px;padding-top:8px;border-top:1px dashed var(--line);font-size:12px}
#modelPop .res b{font-family:"Noto Sans JP",sans-serif}

/* ===== AIの回答は枠なし・列幅いっぱい（自分の発言は右の吹き出しのまま） ===== */
.msg:not(.user){width:auto;min-width:0;max-width:none;margin:0 var(--gut) 16px var(--gut);padding:4px 2px;border:0;border-radius:0;background:transparent;box-shadow:none;backdrop-filter:none}
.msg:not(.user) .tools{justify-content:flex-start;border-top:0;padding-top:0;margin-top:10px}
.msg:not(.user).planned{background:#fffbe6;border-radius:12px;padding:10px 14px;box-shadow:0 0 0 2px rgba(245,196,0,.5)}
.msg:not(.user).anchorFlash{border-radius:12px}
#msgs>.msg:not(.user):only-of-type{max-width:none}
@media (max-width:600px){.msg:not(.user){max-width:none}}
#focus button.primary.stop{background:#b91c1c;border-color:#b91c1c}

<script>
/* ========== 基本ユーティリティ ========== */
const $=s=>document.querySelector(s);
const lsGet=k=>lsGetSafe(k);
const lsSet=(k,v)=>lsSetSafe(k,v);
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const COLORS=['var(--c0)','var(--c1)','var(--c2)','var(--c3)','var(--c4)','var(--c5)','var(--c6)','var(--c7)'];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const estTok=s=>Math.ceil((s||'').length/1.6); // 日英混在の概算
function askConfirm(msg,ok='OK'){return new Promise(res=>{const d=$('#qDlg');$('#qTitle').textContent='確認';$('#qMsg').textContent=msg;$('#qInput').hidden=true;$('#qOk').textContent=ok;
  const done=v=>{d.close();res(v);};$('#qOk').onclick=()=>done(true);$('#qCancel').onclick=()=>done(false);d.oncancel=e=>{e.preventDefault();done(false);};d.showModal();$('#qOk').focus();});}
function askPrompt(title,def='',ok='保存'){return new Promise(res=>{const d=$('#qDlg');$('#qTitle').textContent=title;$('#qMsg').textContent='';const i=$('#qInput');i.hidden=false;i.value=def;$('#qOk').textContent=ok;
  const done=v=>{d.close();i.onkeydown=null;res(v);};$('#qOk').onclick=()=>done(i.value);$('#qCancel').onclick=()=>done(null);d.oncancel=e=>{e.preventDefault();done(null);};
  i.onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();done(i.value);}};d.showModal();i.focus();i.select();});}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',2500);}
function mdInline(s){ // 行内の装飾（入力は生テキスト）
  s=esc(s);
  s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  s=s.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g,'$1<i>$2</i>');
  s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  return s;
}
function mdBlocks(src){ // Markdown をブロック（行・表・コード）ごとのHTML配列にする。逐次表示で差分だけ描き足すため
  const lines=String(src||'').replace(/\r/g,'').split('\n');const out=[];let i=0;
  const isRow=l=>/^\s*\|.*\|\s*$/.test(l);
  const cells=r=>r.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(c=>mdInline(c.trim()));
  while(i<lines.length){
    const L=lines[i];let m;
    if(/^\s*```/.test(L)){const buf=[];let j=i+1;while(j<lines.length&&!/^\s*```/.test(lines[j])){buf.push(lines[j]);j++;}out.push('<pre>'+esc(buf.join('\n'))+'</pre>');i=j+1;continue;}
    if(isRow(L)&&i+1<lines.length&&/^\s*\|?\s*:?-{2,}/.test(lines[i+1])){
      const rows=[];let j=i;while(j<lines.length&&isRow(lines[j])){rows.push(lines[j]);j++;}
      const head=cells(rows[0]);const body=rows.slice(2).map(cells);
      out.push('<div class="tblwrap"><table class="md"><thead><tr>'+head.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+body.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>');i=j;continue;}
    if((m=L.match(/^\s*(#{1,4})\s+(.*)$/))){out.push('<div class="ln h'+m[1].length+'">'+mdInline(m[2])+'</div>');i++;continue;}
    if((m=L.match(/^(\s*)[-*・]\s+(.*)$/))){out.push('<div class="ln li'+(m[1].length>=2?' sub':'')+'">'+mdInline(m[2])+'</div>');i++;continue;}
    if((m=L.match(/^(\s*)(\d+)[.)]\s+(.*)$/))){out.push('<div class="ln li num'+(m[1].length>=2?' sub':'')+'"><span class="n">'+m[2]+'.</span>'+mdInline(m[3])+'</div>');i++;continue;}
    if(/^\s*(-{3,}|\*{3,})\s*$/.test(L)){out.push('<hr class="md">');i++;continue;}
    if((m=L.match(/^\s*>\s?(.*)$/))){out.push('<div class="ln quote">'+mdInline(m[1])+'</div>');i++;continue;}
    out.push('<div class="ln">'+(L.trim()?mdInline(L):'&nbsp;')+'</div>');i++;
  }
  return out;
}
function md(s){return mdBlocks(s).join('');}
// 逐次表示: 前回描いたブロックと比べ、変わった所から描き直す。新しく増えたブロックは滑らかに現れる
function renderStream(body,text){
  const blocks=mdBlocks(text);const prev=body._blocks||[];
  let k=0;while(k<blocks.length&&k<prev.length&&blocks[k]===prev[k])k++;
  while(body.children.length>blocks.length)body.lastChild.remove();
  const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  for(let i=k;i<blocks.length;i++){const t=document.createElement('template');t.innerHTML=blocks[i];const el=t.content.firstElementChild;if(!el)continue;
    const cur=body.children[i];
    if(cur&&cur.tagName===el.tagName&&cur.className.replace(' reveal','')===el.className){cur.innerHTML=el.innerHTML;continue;} // 書きかけの行は中身だけ更新（フェードを途切れさせない）
    if(!reduce){el.classList.add('reveal');el.style.animationDelay=Math.min(Math.max(0,i-Math.max(k,prev.length)),12)*70+'ms';}
    if(cur)cur.replaceWith(el);else body.appendChild(el);}
  body._blocks=blocks;
}

/* ========== 設定 ========== */
const SET_KEY='bc.settings.v1';
const IS_ARTIFACT=true,IS_DESKTOP=false;
let settings=Object.assign({provider:'claude',tier:'default',model:'claude',sumModel:'quick',budget:40000,extra:'',web:false,mcp:[]},JSON.parse(lsGet(SET_KEY)||'{}'));
function saveSettings(){lsSet(SET_KEY,JSON.stringify(settings));}
let sampleFn=null,sampleChecked=false;
async function probeClaude(){
  if(sampleChecked)return sampleFn;
  try{sampleFn=(window.claude&&window.claude.use)?await window.claude.use('sample'):null;}catch(e){sampleFn=null;}
  sampleChecked=true;
  if(!sampleFn)$('#claudeHint').textContent='この画面では Claude を呼べません（claude.ai の中で開いてください）。ダミー応答のみ利用できます。';
  return sampleFn;
}
const ERR_JA={not_granted:'この Artifact による Claude の利用が許可されませんでした',sampling_disabled:'このアカウントでは Claude を利用できません',rate_limited:'利用が集中しています。少し待ってから再送してください',session_expired:'claude.ai に再ログインしてください',refused:'この内容には回答できませんでした。言い方を変えてください',prompt_too_large:'送信内容が大きすぎます。古いブランチを「終了」するかトークン予算を下げてください',empty_completion:'応答が空でした。もう一度送ってください',cancelled:'中止しました',upstream_error:'一時的なエラーです。もう一度送ってください'};
const errCopy=e=>(e&&e.code&&ERR_JA[e.code])||(e&&e.message)||String(e);

/* ========== データモデル ========== */
const CONVS_KEY='bc.convs.v1', ACTIVE_KEY='bc.active.v1';
let convs=JSON.parse(lsGet(CONVS_KEY)||'{}');
let conv=null;
function newConversation(title){
  const id=uid();
  const c={id,title:title||'新しい会話',createdAt:Date.now(),nodes:{},branches:{},activeNodeId:null,order:[]};
  c.branches.main={id:'main',name:'本線',color:COLORS[1],forkFromNodeId:null,headNodeId:null,summary:null,pinned:false,status:'open',createdAt:Date.now(),autoNamed:false,seq:0};
  convs[id]=c;return c;
}
function persist(){
  lsSet(CONVS_KEY,JSON.stringify(convs));
  lsSet(ACTIVE_KEY,conv.id);
}
function loadActive(){
  const id=lsGet(ACTIVE_KEY);
  conv=convs[id]||Object.values(convs)[0]||newConversation();
  persist();
}
const B=id=>conv.branches[id], N=id=>conv.nodes[id];
function ancestors(nodeId){const out=[];let n=N(nodeId);while(n){out.unshift(n);n=n.parentId?N(n.parentId):null;}return out;}
function branchNodes(bid){return conv.order.map(N).filter(n=>n.branchId===bid);}
function currentBranchId(){return conv.activeNodeId?N(conv.activeNodeId).branchId:'main';}
function branchChain(bid){ // main→…→bid
  const out=[];let b=B(bid);while(b){out.unshift(b);b=b.forkFromNodeId?B(N(b.forkFromNodeId).branchId):null;}return out;
}
function childBranchesOf(nodeId){return Object.values(conv.branches).filter(b=>b.forkFromNodeId===nodeId);}
function label(n){return `${B(n.branchId).name} #${n.seq}`;}
function excerpt(s,n=40){s=(s||'').replace(/\s+/g,' ').trim();return s.length>n?s.slice(0,n)+'…':s;}
function addNode(role,content,parentId,branchId){
  const b=B(branchId);b.seq=(b.seq||0)+1;
  const n={id:uid(),parentId,role,content,branchId,ts:Date.now(),seq:b.seq};
  conv.nodes[n.id]=n;conv.order.push(n.id);b.headNodeId=n.id;return n;
}
function createBranch(forkFromNodeId,name){
  const idx=Object.keys(conv.branches).length;
  const b={id:uid(),name:name||'',color:COLORS[idx%COLORS.length],forkFromNodeId,headNodeId:forkFromNodeId,summary:null,pinned:false,status:'open',createdAt:Date.now(),autoNamed:!name,seq:0};
  if(!name){const n=Object.values(conv.branches).filter(x=>x.id!=='main').length+1;b.name='分岐'+n;}
  conv.branches[b.id]=b;return b;
}

/* ========== コンテキスト組み立て（本アプリの核） ========== */
function branchCard(b,cur){
  const from=b.forkFromNodeId?`${label(N(b.forkFromNodeId))}「${excerpt(N(b.forkFromNodeId).content,30)}」から分岐`:'ルート';
  const head=[`- ${b.name}${b.id===cur?'（現在）':''}${b.status==='closed'?'（終了）':''}: ${from}`];
  if(b.status==='closed'&&b.summary){head.push(`  結論: ${b.summary.conclusions||'—'}`);return head.join('\n');}
  if(b.summary){
    head.push(`  話題: ${b.summary.topic||'—'}`);
    head.push(`  結論: ${b.summary.conclusions||'—'}`);
    head.push(`  未解決: ${b.summary.open||'—'}`);
  }else{
    const ns=branchNodes(b.id);
    if(ns.length)head.push(`  （要約未作成）冒頭: ${excerpt(ns[0].content,80)}`);else head.push('  （まだ発言なし）');
  }
  return head.join('\n');
}
function branchTranscript(bid){
  return branchNodes(bid).map(n=>`${n.role==='user'?'ユーザー':'AI'}: ${n.content}`).join('\n\n');
}
function buildContext(targetNodeId,opts={}){
  const cur=opts.branchId||(targetNodeId?N(targetNodeId).branchId:'main');
  const chain=branchChain(cur).map(b=>b.name).join(' → ');
  const cards=Object.values(conv.branches).sort((a,b)=>a.createdAt-b.createdAt).map(b=>branchCard(b,cur)).join('\n');
  let system=`あなたは「分岐型チャット」のアシスタントです。この会話は1本の線ではなく、複数のブランチ（話題）に分かれています。
ユーザーは本線から話題を分岐させ、後で本線に戻ってきます。以下の「会話マップ」に全ブランチの要約があります。
ルール:
- 回答は現在ブランチの話題に集中してください。
- ユーザーが別ブランチの内容に言及したら、そのブランチの結論を踏まえて答えてください。
- 他ブランチの内容を持ち出すときは「（ブランチ「B」で決めた通り）」のように出典を示してください。
- 現在ブランチに関係ない他ブランチの話題を、聞かれてもいないのに混ぜないでください。
${settings.extra?'\n追加指示: '+settings.extra+'\n':''}
## 会話マップ
現在位置: ${chain}
${cards}`;
  const pinned=Object.values(conv.branches).filter(b=>b.pinned&&b.id!==cur);
  const extraPins=(opts.pinIds||[]).map(B).filter(b=>b&&!pinned.includes(b));
  for(const b of pinned.concat(extraPins)){
    system+=`\n\n## 参照ブランチ「${b.name}」の全文\n${branchTranscript(b.id)}`;
  }
  // Layer1: 祖先パス
  let path=targetNodeId?ancestors(targetNodeId):[];
  let msgs=path.map(n=>({role:n.role,content:n.content+((n.images&&n.images.length)?`\n（この発言には画像${n.images.length}枚が添付されていた）`:'')}));
  // 予算超過時は古い往復を省略
  let omitted=0;
  const tot=()=>estTok(system)+msgs.reduce((a,m)=>a+estTok(m.content),0);
  while(msgs.length>4&&tot()>settings.budget){msgs.splice(0,2);omitted++;}
  if(omitted){msgs.unshift({role:'user',content:`（トークン予算のため古い${omitted}往復を省略。会話マップの要約を参照）`},{role:'assistant',content:'了解しました。'});}
  // role交互を保証
  const merged=[];for(const m of msgs){if(merged.length&&merged[merged.length-1].role===m.role)merged[merged.length-1].content+='\n\n'+m.content;else merged.push({...m});}
  if(merged.length&&merged[0].role!=='user')merged.unshift({role:'user',content:'（会話を続けます）'});
  return {system,messages:merged,tokens:tot(),omitted};
}

/* ========== プロバイダ ========== */
async function* streamClaude(system,messages,model,opts={}){
  const sample=await probeClaude();
  if(!sample)throw {code:'not_granted',message:'sample unavailable'};
  // 指示(system相当)は先頭の user ターンとして渡す（Artifact の sample にはsystemが無い）
  const turns=[{role:'user',content:system},...messages.map(m=>({role:m.role,content:m.content}))];
  const q=[];let done=false,err=null,wake=null,result=null;
  const so={cache:false,...((opts.images&&opts.images.length)?{images:opts.images.map(im=>{const b=atob(im.data);const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return new Blob([u],{type:im.media_type});})}:{}),modelTier:opts.raw?'quick':(validModel(model)||settings.tier||'default'),onText:({delta})=>{q.push(delta);if(wake)wake();}};
  if(opts.signal)so.signal=opts.signal;
  const p=sample(turns,so);
  p.then(r=>{result=r;done=true;if(wake)wake();},e=>{err=e;done=true;if(wake)wake();});
  while(true){
    while(q.length)yield {text:q.shift()};
    if(done)break;
    await new Promise(r=>{wake=r;});wake=null;
  }
  if(err){if(err.text&&!q.length){/* 部分テキストは既に流した */}throw err;}
  if(result&&result.modelTierApplied)yield {tier:result.modelTierApplied};
  if(result&&result.truncated)yield {text:'\n\n（長さの上限で途中までになりました）'};
}
async function* streamDummy(system,messages,model,opts={}){
  const names=Object.values(conv.branches).map(b=>b.name+(b.summary?'(要約あり)':''));
  const cur=B(currentBranchId()).name;
  const last=messages[messages.length-1].content;
  const txt=`（ダミー応答・${model}）\n現在ブランチ「${cur}」で「${excerpt(last,30)}」を受け取りました。\n認知しているブランチ: ${names.join(' / ')}\n祖先パス ${messages.length} 件、system ${estTok(system)} tok 相当を受信。設定で「Claude」を選ぶと本物の応答になります。`;
  for(const ch of txt){if(opts&&opts.signal&&opts.signal.aborted)return;await new Promise(r=>setTimeout(r,8));yield {text:ch};}
}
function provider(){return settings.provider==='dummy'?streamDummy:streamClaude;}

/* ========== 要約（Layer2の更新） ========== */
const SUM_SYS=`あなたは会話ブランチの要約係です。与えられた会話ログを読み、次のJSONだけを出力してください（前後に説明を付けない）:
{"title":"10字以内の話題名","topic":"何を話したか（80字以内）","conclusions":"得られた結論・決定事項（120字以内、無ければ「なし」）","open":"未解決の問い（80字以内、無ければ「なし」）"}`;
const summarizing=new Set();
async function updateSummary(bid){
  if(summarizing.has(bid))return;const b=B(bid);const ns=branchNodes(bid);if(!ns.length)return;
  summarizing.add(bid);
  try{
    let out='';
    if(settings.provider==='dummy'){
      out=JSON.stringify({title:excerpt(ns[0].content,10),topic:excerpt(ns[0].content,60),conclusions:'（ダミー）'+excerpt(ns[ns.length-1].content,50),open:'なし'});
    }else{
      const log=(b.summary?`前回の要約: ${JSON.stringify(b.summary)}\n\n`:'')+`会話ログ:\n${branchTranscript(bid)}\n\n上記の会話ログを、指定のJSON形式（title/topic/conclusions/open）だけで要約してください。JSON以外は書かないでください。`;
      for await(const ev of provider()(SUM_SYS,[{role:'user',content:log}],settings.sumModel,{raw:true}))if(ev.text)out+=ev.text;
    }
    const m=out.match(/\{[\s\S]*\}/);if(!m)throw new Error('要約JSONなし');
    const j=JSON.parse(m[0]);
    b.summary={topic:j.topic,conclusions:j.conclusions,open:j.open,updatedAt:Date.now()};
    if(bid==='main'&&conv.title==='新しい会話'&&j.title)conv.title=j.title;
    persist();renderAll();
  }catch(e){console.warn('summary failed',bid,e);}
  finally{summarizing.delete(bid);}
}

/* ========== 送信 ========== */
let busy=false;
let abortCtl=null;
function setSendBtn(running){const b=$('#sendBtn');b.textContent=running?'■ 停止':'送信';b.classList.toggle('stop',running);b.title=running?'生成を中断する':'';}
async function send(text,opts={}){
  if(busy||!text.trim())return;busy=true;abortCtl=new AbortController();setSendBtn(true);
  let bid=opts.branchId||currentBranchId();
  const parentId=opts.parentId!==undefined?opts.parentId:(conv.activeNodeId);
  if(B(bid)&&B(bid).headNodeId!==parentId){ // 途中の回答から続ける＝その回答からの分岐
    const nb=createBranch(parentId,'');bid=nb.id;delete conv._pendingBranch;
    toast(`途中の回答から続けるため、新しい枝「${nb.name}」を作りました`);
  }
  const u=addNode('user',text,parentId,bid);
  if(opts.images&&opts.images.length)u.images=opts.images.map(p=>p.thumb); // 表示用の縮小版だけ保存（送信用の原寸は保存しない）
  const a=addNode('assistant','',u.id,bid);a.streaming=true;if(opts.mergedFrom)a.mergedFrom=opts.mergedFrom;
  conv.activeNodeId=a.id;persist();renderAll();
  const web=!!settings.web&&!IS_ARTIFACT;
  const ctx=buildContext(u.id,{pinIds:opts.pinIds});
  if(web)ctx.system+='\n\n## Web検索\nWeb検索（必要ならページ取得）が使えます。最新情報・具体的な事実・数値・固有名詞・出典が関わる質問では原則として検索し、回答の末尾に出典のURLを示してください。検索を省いてよいのは、挨拶や言い換え、既に会話に出ている内容の整理など、外部情報がまったく不要な場合だけです。';
  const mcpSel=(!IS_ARTIFACT&&settings.mcp&&settings.mcp.length)?settings.mcp.filter(n=>mcpList.some(sv=>sv.name===n&&!sv.needsAuth)):[];
  if(mcpSel.length)ctx.system+=`\n\n## 外部ツール（MCP）\n次の連携ツールが使えます: ${mcpSel.join(' / ')}。参照・検索・取得のために使い、結果を根拠として示してください。作成・送信・削除・更新などデータを変える操作は、ユーザーが明確に指示した場合以外は行わないでください。`;
  setStatus(`Claude が考えています… 概算 ${ctx.tokens} tok`);
  try{
  const model=effModel(bid),effort=effEffort(bid);a.model=model;if(effort)a.effort=effort;
    for await(const ev of provider()(ctx.system,ctx.messages,model,{effort,web,mcp:mcpSel,images:(opts.images||[]).map(p=>p.full),session:{sessionKey:bid,parentId:u.parentId,messageId:a.id},signal:abortCtl.signal})){
      if(ev.mcp_status){const bad=ev.mcp_status.filter(m=>m.status!=='connected');if(bad.length){const names=bad.map(m=>mcpDisplay(m.name));settings.mcpUnavailable=[...new Set([...(settings.mcpUnavailable||[]),...bad.map(m=>{const sv=mcpList.find(x=>x.slug===m.name);return sv?sv.name:m.name;})])];settings.mcp=(settings.mcp||[]).filter(n=>!settings.mcpUnavailable.includes(n));saveSettings();renderMcpBtn();toast('この連携は今の版では使えません（ログインが必要）: '+names.join(', '));}}
      if(ev.tool){(a.tools=a.tools||[]).push(ev.tool);const el=document.getElementById('n-'+a.id);if(el){const tu=el.querySelector('.toolsUsed');if(tu)tu.innerHTML=toolsHTML(a);}}
      if(ev.text){a.content+=ev.text;const el=document.getElementById('n-'+a.id);if(el){renderStream(el.querySelector('.body'),a.content);updateTailSpace();autoScroll();}}
      if(ev.usage)a.usage=ev.usage;
      if(ev.rate)a.rate=ev.rate;
      if(ev.tier)a.tier=ev.tier;
    }
    if(abortCtl&&abortCtl.signal.aborted)throw {code:'cancelled',message:'中止'};
    if(!a.content)a.content='（空の応答）';
  }catch(e){if((abortCtl&&abortCtl.signal.aborted)||(e&&e.code==='cancelled')){a.content+=(a.content?'\n\n':'')+'（中止しました）';a.aborted=true;}else{a.content+=`\n\n⚠️ ${errCopy(e)}`;a.failed=true;toast(errCopy(e));}}
  delete a.streaming;persist();renderAll();
  const u2=a.usage?` / 実トークン in ${a.usage.input_tokens||0}+cache ${a.usage.cache_read_input_tokens||0} out ${a.usage.output_tokens||0}`:'';
  const TIER_JA={default:'標準',complex:'高度',quick:'速い'};
  const t2=a.tier?` / 実際に応答した階層: ${TIER_JA[a.tier]||a.tier}${a.tier!==(settings.tier||'default')?'（プランの都合で指定と異なります）':''}`:'';
  setStatus(`完了 概算 ${ctx.tokens} tok${u2}${t2}`);
  busy=false;abortCtl=null;setSendBtn(false);
  updateSummary(bid);
  fillShortGists();ensureGists();
}
function setStatus(s){$('#status').innerHTML=`<span>${esc(s)}</span><span><span class="ui">接続:</span> ${settings.provider==='dummy'?'ダミー':'Claude（閲覧者のアカウント）/ '+esc(effLabel(effectiveBranchForSend()))}</span><a href="#" id="ctxLink" class="ui">送信コンテキストを見る</a>`;
  $('#ctxLink').onclick=e=>{e.preventDefault();const c=buildContext(conv.activeNodeId);$('#ctxPre').textContent=c.system+'\n\n===== messages ('+c.messages.length+') =====\n'+c.messages.map(m=>`[${m.role}] ${excerpt(m.content,200)}`).join('\n');$('#ctxDlg').showModal();};
}

  const m=$('#msgs');const stick=m.scrollHeight-m.scrollTop-m.clientHeight<200;

  m.querySelectorAll('[data-fork]').forEach(el=>el.onclick=()=>openFork(el.dataset.fork));
  m.querySelectorAll('[data-go]').forEach(el=>el.onclick=()=>gotoNode(el.dataset.go));
  m.querySelectorAll('[data-gohead]').forEach(el=>el.onclick=e=>{e.preventDefault();gotoBranch(el.dataset.gohead);});
  m.querySelectorAll('[data-plan]').forEach(el=>el.onclick=()=>togglePlan(el.dataset.plan));
  m.querySelectorAll('[data-cancelbr]').forEach(el=>el.onclick=e=>{e.stopPropagation();const id=el.dataset.cancelbr;if(conv._pendingBranch===id)cancelBranch(id);else{const b=B(id);if(b&&isEmptyBranch(b)){const name=b.name;delete conv.branches[id];persist();renderAll();toast(`分岐「${name}」を取り消しました`);}}});
  m.querySelectorAll('[data-edit]').forEach(el=>el.onclick=()=>openEdit(el.dataset.edit));
  m.querySelectorAll('[data-export]').forEach(el=>el.onclick=()=>{const [kind,id]=el.dataset.export.split(':');exportDoc(kind,{node:id});});
  const d2=document.getElementById('demoBtn2');if(d2)d2.onclick=loadDemo;
  m.querySelectorAll('.badges .chip').forEach(el=>el.onclick=()=>gotoBranch(el.dataset.b));
  if(stick)m.scrollTop=m.scrollHeight;
  if(!busy)setStatus(`概算 ${buildContext(conv.activeNodeId).tokens} tok を次回送信`);
}

/* ========== トークン数・分岐予定 ========== */
function tokensOf(n){
  if(n.role==='assistant'&&n.usage){const u=n.usage;return (u.input_tokens||0)+(u.cache_read_input_tokens||0)+(u.cache_creation_input_tokens||0)+(u.output_tokens||0);}
  return estTok(n.content);
}
function radiusOf(n){const t=tokensOf(n);return Math.max(5,Math.min(18,4+Math.sqrt(t)/4));}
/* 俯瞰図ラベル用の短い要約（20字以内）。生成前は先頭20字 */
function gistOf(n){return n.gist||excerpt(n.content,20);}
const GIST_SYS=`あなたはチャットメッセージの見出し係です。各メッセージの内容を日本語20字以内に要約してください。体言止め・記号なし。出力はJSONオブジェクトのみ（{"id":"要約",...}）。前後に説明を付けない。`;
let gisting=false;
async function ensureGists(){
  if(gisting||settings.provider==='dummy')return;
  const targets=conv.order.map(N).filter(n=>!n.gist&&!n.streaming&&n.content&&n.content.length>20).slice(0,12);
  if(!targets.length)return;
  gisting=true;
  try{
    const list=targets.map(n=>`[${n.id}] (${n.role==='user'?'ユーザー':'AI'}) ${n.content.replace(/\s+/g,' ').slice(0,500)}`).join('\n\n');
    let out='';
    for await(const ev of provider()(GIST_SYS,[{role:'user',content:`以下の各メッセージを20字以内で要約し、JSONオブジェクト {"id":"要約"} だけを出力してください。\n\n${list}`}],settings.sumModel,{raw:true}))if(ev.text)out+=ev.text;
    const m=out.match(/\{[\s\S]*\}/);if(!m)throw new Error('gist JSONなし');
    const j=JSON.parse(m[0]);let hit=0;
    for(const n of targets){if(typeof j[n.id]==='string'&&j[n.id].trim()){n.gist=j[n.id].trim().slice(0,20);hit++;}}
    if(hit){persist();if($('#overview').classList.contains('on'))renderOverview();}
  }catch(e){console.warn('gist failed',e);}
  finally{gisting=false;}
  // 残りがあれば続けて生成
  if(conv.order.map(N).some(n=>!n.gist&&!n.streaming&&n.content&&n.content.length>20))setTimeout(ensureGists,300);
}
// 短い文はそのまま gist にする（API節約）
function fillShortGists(){for(const id of conv.order){const n=N(id);if(!n.gist&&n.content&&n.content.length<=20&&!n.streaming)n.gist=n.content.trim();}}
function togglePlan(nid){const n=N(nid);if(isDeadNode(n)){toast('中止した回答には分岐予定を付けられません');return;}n.planned=!n.planned;persist();renderAll();toast(n.planned?'★ 分岐予定に追加（俯瞰図で黄色表示）':'分岐予定を解除');}
function plannedNodes(){return conv.order.map(N).filter(n=>n.planned);}

/* ========== Web検索の表示 ========== */
function toolsHTML(n){return (n.tools||[]).map(t=>`<span class="toolchip"><span class="ui">${t.name==='mcp'?'🔌 '+esc(mcpDisplay(t.server))+': ':t.name==='web_fetch'?'🌐 取得':'🔍 Web検索'}</span>${t.name==='mcp'?`<span class="var">${esc(t.tool||'')}</span>`:''}${t.q?`「<span class="var">${esc(excerpt(t.q,40))}</span>」`:''}</span>`).join('');}
function mcpDisplay(slug){const sv=mcpList.find(x=>x.slug===slug);return (sv?sv.name:slug||'MCP').replace(/^claude\.ai /,'');}
let mcpList=[],mcpLoaded=false;
async function loadMcp(force){

function renderMcpPop(){

  pop.innerHTML=`<div class="mph ui">連携ツール（MCP）</div><div class="hint ui" style="margin-bottom:6px">選んだ連携だけをAIに渡します（Claude のみ。GPT では使えません）。選ぶほど1回の送信が重くなります。</div>
    ${mcpList.map(sv=>{const on=(settings.mcp||[]).includes(sv.name);const dis=sv.needsAuth||(settings.mcpUnavailable||[]).includes(sv.name);return `<label class="mcprow${dis?' dis':''}"><input type="checkbox" data-mcp="${esc(sv.name)}" ${on?'checked':''} ${dis?'disabled':''}> <span class="var">${esc(sv.name.replace(/^claude\.ai /,''))}</span> <span class="hint">${dis?'認証が必要な連携は今は使えません':sv.kind==='http'?'（オンライン）':'（このPC上）'}</span></label>`;}).join('')}

  const rl=document.getElementById('mcpReload');if(rl)rl.onclick=async e=>{e.stopPropagation();rl.disabled=true;await loadMcp(true);renderMcpPop();};

function renderWebBtn(){renderPlus();}

/* ========== 質問の編集 ========== */
function editContext(nid){
  const n=N(nid);const b=B(n.branchId);
  const kids=conv.order.map(N).filter(x=>x.parentId===nid);
  const reply=kids.find(x=>x.role==='assistant'&&x.branchId===n.branchId)||null;
  const later=reply?conv.order.map(N).some(x=>x.parentId===reply.id):kids.length>0;
  const isHead=b.headNodeId===(reply?reply.id:nid);
  return {n,b,reply,inPlace:!later&&isHead};
}
function openEdit(nid){
  if(busy){toast('生成中は編集できません');return;}
  const el=document.getElementById('n-'+nid);if(!el)return;
  const {n,inPlace}=editContext(nid);
  const body=el.querySelector('.body');
  body.innerHTML=`<textarea class="editBox" id="edit-${nid}"></textarea>
    <div class="editBtns"><span class="hint ui">${inPlace?'保存すると、この質問への回答を作り直します':'元のやり取りは残し、書き直した質問で新しい分岐を始めます'}</span>
    <button class="small" data-editcancel="${nid}">キャンセル</button><button class="small primary" data-editok="${nid}">送信し直す</button></div>`;
  const ta=body.querySelector('textarea');ta.value=n.content;ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length);
  el.classList.add('editing');
  el.querySelector('.tools').hidden=true;
  body.querySelector('[data-editcancel]').onclick=()=>renderFocus();
  body.querySelector('[data-editok]').onclick=()=>{const t=ta.value.trim();if(!t){toast('質問が空です');return;}editQuestion(nid,t);};
  ta.onkeydown=e=>{if(e.key==='Escape'){renderFocus();}if((e.metaKey||e.ctrlKey)&&e.key==='Enter'){body.querySelector('[data-editok]').click();}};
}
function editQuestion(nid,text){
  const {n,b,reply,inPlace}=editContext(nid);
  if(text===n.content){renderFocus();return;}
  if(inPlace){
    // 最新の質問: 質問と回答を取り除いて送り直す
    for(const x of [reply,n].filter(Boolean)){delete conv.nodes[x.id];conv.order=conv.order.filter(id=>id!==x.id);}
    b.seq=Math.max(0,(b.seq||0)-(reply?2:1));
    b.headNodeId=n.parentId;conv.activeNodeId=n.parentId;persist();
    send(text,{branchId:b.id,parentId:n.parentId});
  }else{
    // 途中の質問: 元は残し、直前の回答から新しい分岐で質問し直す
    const nb=createBranch(n.parentId,'');
    conv.activeNodeId=n.parentId;delete conv._pendingBranch;persist();
    toast(`書き直した質問で分岐「${nb.name}」を開始します`);
    send(text,{branchId:nb.id,parentId:n.parentId});
  }
}

/* ========== 分岐 ========== */
/* 分岐元メッセージを画面の一番上へ。下に余白(tailSpace)を足して上端まで届くようにする */
function updateTailSpace(){
  const m=$('#msgs');const sp=document.getElementById('tailSpace');if(!sp)return;
  const el=conv._anchor?document.getElementById('n-'+conv._anchor):null;
  if(!el){sp.style.height='0px';return;}
  sp.style.height='0px';
  const below=m.scrollHeight-el.offsetTop; // アンカー上端から内容末尾まで
  sp.style.height=Math.max(0,m.clientHeight-below+8)+'px';
}
function scrollAnchorToTop(flash){
  const m=$('#msgs');const el=conv._anchor?document.getElementById('n-'+conv._anchor):null;if(!el)return;
  updateTailSpace();
  const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  m.scrollTo({top:Math.max(0,el.offsetTop-8),behavior:reduce?'auto':'smooth'});
  if(flash){el.classList.remove('anchorFlash');void el.offsetWidth;el.classList.add('anchorFlash');}
}
function cancelBranch(bid){
  const b=B(bid);if(!b||!isEmptyBranch(b))return;
  const name=b.name;
  if(conv._pendingBranch===bid)delete conv._pendingBranch;
  delete conv.branches[bid];delete conv._anchor;
  if(conv._returnNode&&N(conv._returnNode))conv.activeNodeId=conv._returnNode;
  delete conv._returnNode;
  persist();showFocus();toast(`分岐「${name}」を取り消しました`);
}
// 中止・失敗した回答は分岐元にしない（内容が途中で切れているため）
function isDeadNode(n){return !!(n&&n.role==='assistant'&&(n.aborted||n.failed||/（中止しました）\s*$/.test(n.content||'')||/⚠️ (エラー|.*できません)/.test((n.content||'').slice(-200))));}
function emptyBranchFrom(nid){return Object.values(conv.branches).find(b=>b.forkFromNodeId===nid&&b.headNodeId===b.forkFromNodeId)||null;}
function isEmptyBranch(b){return b.id!=='main'&&b.headNodeId===b.forkFromNodeId;}
function openFork(nid,name){
  if(isDeadNode(N(nid))){toast('中止した回答からは分岐できません。質問を送り直してください');return;}
  // 同じ回答から未開始（発言ゼロ）の分岐が既にあれば、新しく作らずそこへ移動
  const ex=emptyBranchFrom(nid);
  if(ex){if(conv._pendingBranch!==ex.id)conv._returnNode=conv.activeNodeId;conv.activeNodeId=nid;conv._pendingBranch=ex.id;conv._anchor=nid;persist();showFocus();scrollAnchorToTop(true);
    if(conv._pendingQuote){$('#input').value=conv._pendingQuote+$('#input').value;delete conv._pendingQuote;}
    toast(`この回答からは未開始の分岐「${ex.name}」があります。先にそこで発言してから次の分岐を作れます`);$('#input').focus();return;}
  // ダイアログ無しで即分岐。名前は「分岐N」（選択テキストからの分岐は選択部分）。後から「名前」で変更可
  const b=createBranch(nid,(name||'').trim().slice(0,30));
  delete N(nid).planned;
  const quote=conv._pendingQuote;delete conv._pendingQuote;
  conv._returnNode=conv.activeNodeId; // 取り消したときに戻る位置
  conv.activeNodeId=nid; // 分岐元ノードの直後から
  conv._pendingBranch=b.id;
  conv._anchor=nid;
  persist();showFocus();
  if(quote){$('#input').value=quote+$('#input').value;}
  scrollAnchorToTop(true);
  $('#input').focus({preventScroll:true});$('#input').setSelectionRange($('#input').value.length,$('#input').value.length);
}
// 分岐直後は activeNode が分岐元(別ブランチ)なので、送信先ブランチを pending で決める
function effectiveBranchForSend(){
  if(conv._pendingBranch&&B(conv._pendingBranch)){const b=B(conv._pendingBranch);if(b.headNodeId===b.forkFromNodeId)return b.id;}
  return currentBranchId();
}

/* ========== 俯瞰図 ========== */
function showFocus(){$('#overview').classList.remove('on');$('#focus').classList.remove('off');setViewUI('focus');renderAll();}
function showOverview(){$('#overview').classList.add('on');$('#focus').classList.add('off');setViewUI('over');fillShortGists();renderAll();ensureGists();}
function setViewUI(v){$('#viewCur').textContent=v==='over'?'俯瞰図':'チャット';$('#viewPop').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.view===v));}
$('#viewBtn').onclick=e=>{e.stopPropagation();const m=$('#viewMenu'),pop=$('#viewPop');m.classList.toggle('open');
  // 画面右端からはみ出す場合は右寄せにする
  pop.style.left='0';pop.style.right='auto';const r=pop.getBoundingClientRect();if(r.right>innerWidth-8){pop.style.left='auto';pop.style.right='0';}};
$('#viewPop').querySelectorAll('button').forEach(b=>b.onclick=e=>{e.stopPropagation();$('#viewMenu').classList.remove('open');if(b.dataset.view==='over')showOverview();else showFocus();});
document.addEventListener('click',e=>{if(!e.target.closest('#viewMenu'))$('#viewMenu').classList.remove('open');});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#viewMenu').classList.remove('open');});
function renderOverview(){
  const bs=Object.values(conv.branches).sort((a,b)=>a.createdAt-b.createdAt);
  const lane={};bs.forEach((b,i)=>lane[b.id]=i);
  const rowOf={};conv.order.forEach((id,i)=>rowOf[id]=i);
  const X=i=>110+i*300, Y=i=>70+i*44;
  const W=Math.max(420,110+bs.length*300+120), Hh=Math.max(240,70+conv.order.length*44+60);
  const forkPoints=new Set(Object.values(conv.branches).map(b=>b.forkFromNodeId).filter(Boolean));
  // 波紋: 控えめ（広がり小・細線・淡く・ゆっくり・2重）
  const ripple=(x,y,r0,col,dur,n)=>{let o='';for(let i=0;i<n;i++){const b=(dur*i/n).toFixed(2)+'s';
    o+=`<circle cx="${x}" cy="${y}" r="${r0}" fill="none" stroke="${col}" stroke-width="1.2" opacity="0"><animate attributeName="r" values="${r0};${r0+14}" dur="${dur}s" begin="${b}" repeatCount="indefinite" calcMode="spline" keySplines="0.2 0.6 0.4 1"/><animate attributeName="opacity" values=".45;0" dur="${dur}s" begin="${b}" repeatCount="indefinite"/></circle>`;}
    return o;};
  let s=`<svg width="${W}" height="${Hh}" xmlns="http://www.w3.org/2000/svg" style="display:block">
  <defs><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="glow2" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="1.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>`;
  // レーン縦線（薄い）と見出し
  for(const b of bs){const x=X(lane[b.id]);
    s+=`<line x1="${x}" y1="40" x2="${x}" y2="${Hh-20}" stroke="${b.color}" stroke-opacity=".18" stroke-width="2"/>`;
    const hn=excerpt(b.name,12);const hw=[...hn].reduce((a,ch)=>a+(ch.charCodeAt(0)>0x2e7f?17:9.5),0)+20;
    s+=`<rect x="${x-hw/2}" y="8" width="${hw}" height="30" rx="8" fill="#fff" stroke="${b.color}" stroke-width="2"/>`;
    s+=`<text x="${x}" y="29" text-anchor="middle" style="fill:${b.color};font-weight:700;font-size:17px;letter-spacing:.04em">${esc(hn)}</text>`;}
  // 接続線
  for(const id of conv.order){const n=N(id);if(!n.parentId)continue;const p=N(n.parentId);
    const x1=X(lane[p.branchId]),y1=Y(rowOf[p.id]),x2=X(lane[n.branchId]),y2=Y(rowOf[n.id]);const col=B(n.branchId).color;
    if(x1===x2)s+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="3.5" filter="url(#glow)"/>`;
    else s+=`<path d="M${x1},${y1} C${x1},${(y1+y2)/2} ${x2},${(y1+y2)/2} ${x2},${y2}" fill="none" stroke="${col}" stroke-width="3.5" stroke-dasharray="7 5" filter="url(#glow)"><animate attributeName="stroke-dashoffset" values="24;0" dur="2.4s" repeatCount="indefinite"/></path>`;}
  // 波紋（分岐点・現在位置）
  for(const id of conv.order){const n=N(id);const x=X(lane[n.branchId]),y=Y(rowOf[id]);const r=radiusOf(n);
    if(forkPoints.has(id))s+=ripple(x,y,r+3,B(n.branchId).color,4,2);
    if(id===conv.activeNodeId)s+=ripple(x,y,r+3,'var(--indigo)',3.2,2);}
  // ノード
  for(const id of conv.order){const n=N(id);const b=B(n.branchId);const x=X(lane[n.branchId]),y=Y(rowOf[id]);const r=radiusOf(n);const act=id===conv.activeNodeId;
    const col=n.planned?'var(--ystroke)':b.color;
    s+=`<g class="node" data-n="${id}"><title>${esc(label(n))} [${n.role==='user'?'あなた':'AI'}] ${tokensOf(n)} tok${n.planned?' ★分岐予定':''}${forkPoints.has(id)?' ⑂分岐点':''}\n${esc(excerpt(n.content,160))}</title>`;
    if(n.planned)s+=`<circle cx="${x}" cy="${y}" r="${r+5}" fill="none" stroke="var(--ystroke)" stroke-width="3" filter="url(#glow2)"><animate attributeName="r" values="${r+4};${r+6};${r+4}" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".9;.5;.9" dur="2.4s" repeatCount="indefinite"/></circle>`;
    if(act)s+=`<circle cx="${x}" cy="${y}" r="${r+5}" fill="none" stroke="var(--indigo)" stroke-width="2.5"/>`;
    s+=`<circle class="core" cx="${x}" cy="${y}" r="${r}" fill="${n.role==='assistant'?(n.planned?'var(--yellow)':col):'#fff'}" stroke="${col}" stroke-width="3" filter="url(#glow2)"/>`;
    const g=gistOf(n);const tw=[...g].reduce((a,ch)=>a+(ch.charCodeAt(0)>0x2e7f?13:7.4),0)+10;
    s+=`<rect x="${x+r+6}" y="${y-10}" width="${tw}" height="20" rx="5" fill="#fff" fill-opacity=".95" stroke="${n.planned?'var(--ystroke)':b.color}" stroke-opacity=".35" stroke-width="1"/>`;
    s+=`<text x="${x+r+11}" y="${y+4.5}" style="fill:${n.planned?'var(--ystroke)':'var(--indigo)'}">${esc(g)}</text></g>`;}
  s+='</svg>';
  $('#graphSvg').innerHTML=s;
  $('#legend').innerHTML=`<span><i style="background:var(--indigo)"></i>大きさ＝トークン数</span><span>◎ 波紋＝現在位置（藍）・分岐点（ブランチ色）</span><span><i style="background:var(--yellow);border:2px solid var(--ystroke)"></i>黄＝分岐予定</span><span>塗り＝AI / 中抜き＝あなた</span>`;
  $('#graphSvg').querySelectorAll('.node').forEach(el=>el.onclick=()=>gotoNode(el.dataset.n));
  // カード
  const cur=currentBranchId();
  const plans=plannedNodes();
  const planCard=plans.length?`<div class="card plans"><h3 class="ui">★ 分岐予定 <span class="hint">${plans.length}件</span></h3>${plans.map(n=>`<div class="item"><span>${esc(label(n))}「${esc(excerpt(n.content,18))}」</span><span><button class="small plan" data-forkp="${n.id}">分岐する</button><button class="small" data-unplan="${n.id}">解除</button></span></div>`).join('')}</div>`:'';
  $('#cards').innerHTML=planCard+bs.map(b=>{
    const from=b.forkFromNodeId?`${esc(label(N(b.forkFromNodeId)))}「${esc(excerpt(N(b.forkFromNodeId).content,24))}」から`:'ルート';
    const toks=branchNodes(b.id).reduce((a,n)=>a+tokensOf(n),0);
    const sum=b.summary?`<div class="sum"><b>話題</b>${esc(b.summary.topic)}<b>結論</b>${esc(b.summary.conclusions)}<b>未解決</b>${esc(b.summary.open)}</div>`:`<div class="sum hint ui">要約未作成（AIの回答後に自動生成）</div>`;
    return `<div class="card${b.pinned?' pinned':''}" style="--bc:${b.color}"><h3>${esc(b.name)}${b.id===cur?' <span class="hint">現在</span>':''}${b.status==='closed'?' <span class="hint">終了</span>':''}</h3>
      <div class="from">${from} / ${branchNodes(b.id).length} <span class="ui">発言</span> / ${toks} tok${(validModel(b.model)||validEffort(b.effort))?` / <span title="このブランチ専用のモデル設定">⚙ ${esc(effLabel(b.id))}</span>`:''}</div>${sum}
      <div class="act">
        <button class="small" data-go="${b.id}">移動</button>

const MODEL_OPTS=[{v:'default',l:'標準',d:'バランス型。考えてから書く'},{v:'complex',l:'高度',d:'最も高性能。深く考える・遅い'},{v:'quick',l:'速い',d:'考えずに即応答'}];
const EFFORT_OPTS=[]; // Artifact の sample には思考量の指定が無い（階層に含まれる）
const ALL_EFFORTS=[];
function refreshModelCatalog(){} // この版は選択肢が固定

function effortsFor(v){return [];}

/* ========== モデル・思考量（ブランチごと） ========== */
// 継承: 自分のブランチの指定 → 分岐元のブランチ → … → 本線 → 全体の既定。指定が無いブランチは分岐元に従う
const validModel=v=>MODEL_OPTS.some(o=>o.v===v)?v:null;
const validEffort=v=>EFFORT_OPTS.some(o=>o.v===v)?v:null;
const modelLabel=v=>(MODEL_OPTS.find(o=>o.v===v)||{l:v||'—'}).l;
function parentBranchId(bid){const b=B(bid);if(!b||!b.forkFromNodeId||!N(b.forkFromNodeId))return null;return N(b.forkFromNodeId).branchId;}
function resolveUp(bid,key,valid){
  let id=bid,guard=0;
  while(id&&guard++<100){const b=B(id);const v=b&&valid(b[key]);if(v)return {v,src:id};id=parentBranchId(id);}
  return {v:valid(key==='model'?globalModel():settings.effort),src:'global'};
}
// 旧形式（会話単位の指定）は本線の指定へ移す。本線の指定＝会話全体の指定として働く
function migrateConvModel(){for(const k of ['model','effort']){if(conv&&conv[k]!==undefined){const m=B('main');if(m&&m[k]===undefined)m[k]=conv[k];delete conv[k];}}}
function effModel(bid){return resolveUp(bid,'model',validModel).v||MODEL_OPTS[0].v;}
function effEffort(bid){return null;} // 思考量は階層に含まれる
function effLabel(bid){const e=effEffort(bid);return modelLabel(effModel(bid))+(e?' · '+e:'');}
function modelSource(bid){const a=resolveUp(bid,'model',validModel).src,b=EFFORT_OPTS.length?resolveUp(bid,'effort',validEffort).src:'global';if(a===bid||b===bid)return bid;return a!=='global'?a:b;}

  const upName=pid==='main'?'本線の設定':pid?`分岐元「${excerpt(B(pid).name,8)}」の設定`:'';

    <div class="hint ui" style="margin-bottom:4px">${bid==='main'?'本線の設定は、個別に指定していない全ブランチにも引き継がれます':'このブランチと、ここから先の分岐にだけ効きます'}</div>

async function exportDoc(kind,opts={}){
  if(!IS_DESKTOP){toast('ファイルの書き出しはデスクトップ版で使えます');return;}
  let title,sections;
  if(opts.node){const n=N(opts.node);const q=n.parentId&&N(n.parentId)&&N(n.parentId).role==='user'?N(n.parentId).content:'';title=excerpt(gistOf(n)||q||conv.title,40);sections=[{heading:'',markdown:n.content}];}
  else{ // ブランチ全体: 質問を見出し、回答を本文に
    const bid=opts.branch||currentBranchId();const b=B(bid);title=`${conv.title}${bid==='main'?'':' / '+b.name}`;
    const path=b.headNodeId?ancestors(b.headNodeId):[];sections=[];let q='';
    for(const n of path){if(n.role==='user'){q=n.content;}else if(n.role==='assistant'&&!isDeadNode(n)){sections.push({heading:excerpt(q,60),markdown:n.content});}}
    if(!sections.length){toast('書き出す回答がありません');return;}
  }
  toast(kind==='pptx'?'スライドを作成中…':'文書を作成中…');
  try{const r=await(await fetch('/api/export',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind,title,sections})})).json();
    if(r.ok){lastExportPath=r.path;toast(`保存しました: ${r.path.split('/').pop()}`);}else if(!r.canceled)toast('作成できませんでした: '+(r.error||''));}
  catch(e){toast('作成できませんでした');}
}

function renderImgStrip(){const s=$('#imgStrip');if(!s)return;s.innerHTML=pendingImgs.map((p,i)=>`<div class="th"><img src="${p.thumb}" alt=""><button data-rmimg="${i}" title="外す">✕</button></div>`).join('');s.querySelectorAll('[data-rmimg]').forEach(b=>b.onclick=()=>{pendingImgs.splice(+b.dataset.rmimg,1);renderPlus();});}
// 画像を縮小して JPEG に。full=送信用(長辺1600)、thumb=表示用(長辺256)
function prepImage(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const im=new Image();im.onload=()=>{URL.revokeObjectURL(url);const fit=(max)=>{const r=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*r));c.height=Math.max(1,Math.round(im.height*r));const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);return c;};
  const full=fit(1600).toDataURL('image/jpeg',.85),thumb=fit(256).toDataURL('image/jpeg',.8);res({full:{media_type:'image/jpeg',data:full.split(',')[1]},thumb});};im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('画像を読めませんでした'));};im.src=url;});}
async function addImages(files){if(!imagesSupported){toast('この接続方式では画像を送れません');return;}const list=[...files].filter(f=>/^image\//.test(f.type)).slice(0,4-pendingImgs.length);if(!list.length)return;for(const f of list){try{pendingImgs.push(await prepImage(f));}catch(e){toast(e.message);}}renderPlus();toast(`画像を${list.length}枚添付しました（送信時に一緒に送ります）`);}
function imgsHTML(n){return (n.images&&n.images.length)?`<div class="imgs">${n.images.map(t=>`<img src="${t}" alt="添付画像">`).join('')}</div>`:'';}
